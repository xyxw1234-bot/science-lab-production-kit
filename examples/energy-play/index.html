<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发电带动小屋｜交互管线示例</title><link rel="stylesheet" href="style.css"><body>

<details id="about"><summary>原理与模型边界</summary><p>摇柄的机械输入带动发电机，电流给负载供电。增加用电负载会增加发电机的反向电磁力矩。停下摇柄后，转动会逐渐减慢。</p><p>此处为自建简化直流发电模型与原理图，不是实物工程复刻。灯采用电阻近似；风扇转速是随端电压变化的教学映射，未求解真实电机本构。实时结果是模型结果，不是测量。</p><p>讲解为固定审核文本的合成音频，不是实时AI问答。完整产品的实时解读须接真实模型与安全后端。</p></details></main><audio id="narration" preload="none"></audio><script>
(()=>{const button=document.getElementById('enter'),status=document.getElementById('boot-status');let failed=false,pending=false;
button.onclick=()=>{if(failed){location.reload();return;}try{const C=window.AudioContext||window.webkitAudioContext;if(C){window.__energyAudioContext=window.__energyAudioContext||new C();window.__energyAudioContext.resume();}}catch{}if(window.__energyStart){window.__energyStart();return;}pending=true;button.disabled=true;status.textContent='正在准备画面和讲解…';};
import('./app.mjs').then(()=>{button.disabled=false;status.textContent='';if(pending){pending=false;window.__energyStart();}}).catch(()=>{failed=true;button.disabled=false;button.textContent='重试打开';status.textContent='暂时没能打开。网络恢复后，点这里重试。';});
})();
</script></body></html>
